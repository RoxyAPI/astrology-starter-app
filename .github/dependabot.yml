version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR for routine bumps, so CI runs once and the auto-merge workflow can clear it.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # THE EXPO SDK OWNS THESE VERSIONS. The SDK template pins react, react-native and every
      # native module to exact versions that are built and tested against each other, and
      # "npx expo install --fix" is the only thing allowed to move them. React Native is on 0.x,
      # so an 0.x -> 0.x+1 bump is a BREAKING release that Dependabot happily classifies as a minor
      # and auto-merges. That is not theoretical: 0.85 -> 0.86 landed once on its own and broke
      # "npm ci" outright, because jest-expo still wanted @react-native/jest-preset ^0.85 while
      # react-native demanded 0.86. Ignore ALL update types here, not just majors. Upgrading these
      # means upgrading the Expo SDK, deliberately, with expo install --fix and expo-doctor.
      # Current baseline: SDK 57 / React Native 0.86 / React 19.2.3 (taken 2026-07-27). The pins are
      # authoritative in expo/bundledNativeModules.json, and expo-doctor is the validator, not
      # "expo install --fix", which reports "up to date" on an already broken tree. Note --fix only
      # rewrites dependencies, never devDependencies, so jest-expo and babel-preset-expo must be
      # moved to the new SDK major BY HAND in the same install or npm ERESOLVEs on the jest preset.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-async-storage/async-storage"
      # The expo-* family ships as one SDK release, so a lone MAJOR breaks the app. Patch and
      # minor inside the current SDK still flow.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      # jest-expo and babel-preset-expo track the REACT NATIVE version, not merely the SDK major,
      # so no update type on them is safe while react-native is pinned. Measured on SDK 57:
      # jest-expo 57.0.2 peers "@react-native/jest-preset": "^0.86.0" and resolves cleanly, while
      # the 57.0.3 PATCH raises that to "^0.86.2" against a react-native 0.86.0 whose own
      # peerOptional pins the preset to exactly "0.86.0". The intersection is empty, so npm
      # ERESOLVEs and the whole grouped pull request dies at install before running one test,
      # which is why unrelated bumps in the same group stopped merging. These two move only with
      # a deliberate SDK upgrade, and "expo install --fix" rewrites dependencies only, so both
      # have to be edited by hand at that point.
      - dependency-name: "jest-expo"
      - dependency-name: "babel-preset-expo"
      # Jest stays on 29 because jest-expo 57 IS a jest 29 package: it depends on babel-jest,
      # @jest/globals, jest-snapshot and jest-environment-jsdom at ^29.2.1. Taking jest 30 installs
      # a second jest runtime beside the preset that actually runs the suite. @types/jest tracks
      # whatever jest resolves to, so it is pinned to the same major. Jest moves with the SDK.
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      # NativeWind owns the Tailwind version. This app is on a Tailwind 3 config (content globs plus
      # presets: [nativewind/preset]), and Tailwind 4 replaces that with a CSS-first @theme engine
      # NativeWind 4 has no preset for. The peer range says >3.3.0, which makes it look safe and it
      # is not. Tailwind 4 means NativeWind 5, deliberately.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is a full compiler rewrite. Revisit deliberately, not as a drive-by bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
